[alembic]
script_location = %(here)s/alembic

# Nazivi datoteka migracija: 001_init_users_and_courts.py
file_template = %%(rev)s_%%(slug)s

# Dodaje mapu api/ u sys.path tako da env.py može uvesti paket app
prepend_sys_path = .
path_separator = os

# URL baze postavlja env.py iz app.core.config (iz .env / okoline)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
